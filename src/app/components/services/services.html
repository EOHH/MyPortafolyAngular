<section id="services" class="services-section">
  <div class="container">
    <div class="section-header">
      <h2>{{ sectionHeader.title }}</h2>
      <p>{{ sectionHeader.subtitle }}</p>
    </div>

    <div class="services-grid">
      @for (service of services; track service.title) {
      <div class="service-card">
        <div class="service-icon-wrapper">
          <fa-icon [icon]="service.icon" class="service-icon"></fa-icon>
        </div>
        <h3>{{ service.title }}</h3>
        <p class="service-description">{{ service.description }}</p>
        <div class="service-technologies">
          @for (tech of service.technologies; track tech.name) {
          <span class="tech-tag">
            @if (tech.icon) { <fa-icon [icon]="tech.icon"></fa-icon> } {{ tech.name }}
          </span>
          }
        </div>
      </div>
      } @empty {
      <p>No hay servicios disponibles.</p>
      }
    </div>
  </div>
</section>
