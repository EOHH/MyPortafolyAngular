<section id="hero" class="hero-section">
  <div class="hero-layout">
    
    <!-- Contenido Izquierdo -->
    <div class="hero-content">
      <div class="content-wrapper">
        <p class="greeting">Hola, soy <span class="highlight">{{ name }}</span></p>
        <h1 class="hero-title">{{ title }}</h1>
        
        <!-- Efecto máquina de escribir -->
        <div class="typewriter-wrapper" aria-label="Especialización">
          <p class="specialization">{{ specialization }}</p>
        </div>
        
        <p class="hero-tagline">{{ tagline }}</p>

        <div class="hero-actions">
          <!-- Botón primario con hover magnético -->
          <a href="#portfolio" 
             class="btn-primary magnetic-btn" 
             (mousemove)="magneticMove($event)"
             (mouseleave)="magneticLeave($event)">
            Ver Proyectos
            <fa-icon [icon]="['fas', 'arrow-right']"></fa-icon>
          </a>
          
          <!-- Botón secundario para CV -->
          <a [href]="cvLink" download class="btn-secondary">
            Descargar CV
            <fa-icon [icon]="['fas', 'download']"></fa-icon>
          </a>
        </div>

        <div class="hero-social">
          @for (link of socialLinks; track link.name) {
          <a [href]="link.url"
             target="_blank"
             [attr.aria-label]="'Visitar mi ' + link.name">
            <fa-icon [icon]="link.icon"></fa-icon>
          </a>
          }
        </div>
      </div>
    </div>

    <!-- Imagen Derecha -->
    <div class="hero-visual">
      <div class="visual-wrapper">
        <div class="geometric-shape"></div>
        <img [src]="profileImageUrl" alt="Edilson Huaman - {{ title }}" class="profile-mask-img" loading="lazy">
      </div>
    </div>
    
  </div>
</section>
